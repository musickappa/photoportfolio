services:
  - type: web
    name: photoportfolio
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn pj_profileweb.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.9.16"
      - key: DATABASE_URL
        fromDatabase:
          name: photoportfolio-db
          property: connectionString

databases:
  - name: photoportfolio-db
    databaseName: photoportfolio
    user: photoportfolio
    region: singapore
    plan: free
